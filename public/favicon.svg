<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Velvet Rose Gradient -->
    <linearGradient id="roseGradient" x1="20" y1="20" x2="108" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5265D" />
      <stop offset="50%" stop-color="#8B1A4A" />
      <stop offset="100%" stop-color="#560C2C" />
    </linearGradient>
    
    <!-- Rose Gold Star Gradient -->
    <linearGradient id="goldGradient" x1="70" y1="25" x2="110" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2D8A7" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#9A7A43" />
    </linearGradient>

    <!-- Subtle Shine Glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Almond Nail Silhouette -->
  <path 
    d="M64 12 C 46 36, 38 60, 38 92 C 38 108, 48 116, 64 116 C 80 116, 90 108, 90 92 C 90 60, 82 36, 64 12 Z" 
    fill="url(#roseGradient)" 
  />

  <!-- High-Gloss Curve Highlight -->
  <path 
    d="M 52 96 C 47 88, 45 68, 55 42" 
    stroke="#F5E4E4" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    opacity="0.75" 
  />

  <!-- Sparkling Star Accent -->
  <g filter="url(#softGlow)">
    <!-- 8-point Sparkle Star -->
    <path 
      d="M86 36 L89 45 L98 48 L89 51 L86 60 L83 51 L74 48 L83 45 Z" 
      fill="url(#goldGradient)" 
    />
    <!-- Diagonal Minor Rays -->
    <path 
      d="M86 42 L88 46 L92 48 L88 50 L86 54 L84 50 L80 48 L84 46 Z" 
      fill="#FFE8C2" 
      opacity="0.8" 
    />
  </g>
</svg>
